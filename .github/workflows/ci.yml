name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Test (Windows / Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Electron binary
        run: npm run verify:electron

      - name: Check i18n dictionaries
        run: npm run i18n:check

      - name: Build user manual
        run: npm run build:manual

      - name: Run unit and integration tests
        run: npm test

      - name: Run English UI localization smoke test
        run: npm run test:ui:en

      - name: Static syntax check
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path src, build, scripts, tools -Filter *.js -Recurse
          foreach ($f in $files) {
            node -c $f.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "Syntax check passed for $($files.Count) JS files."

      - name: Validate packaging configuration & portable build
        if: matrix.node == 22
        run: npm run pack

      - name: Mouse hook logic smoke test
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          $out = & .\test\pointer-hook-logic.ps1
          $out | ForEach-Object { Write-Host $_ }
          if (-not ($out -contains 'POINTER_HOOK_LOGIC_OK')) { exit 1 }
